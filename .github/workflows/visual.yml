name: Visual

on:
  # ON-DEMAND since 2026-08-29 (owner decision): the pixel-diff is no longer a
  # push gate. Every UI change is eyeballed locally, and the crash class of
  # regression (page throws, section vanishes) is caught by the fast AppTest /
  # DOM suites in `CI`. In two months as a gate this job never caught a
  # regression a human had not already seen, cost ~16 min of Docker regen per
  # visible change, and went chronically red once (07-09). Run it by hand
  # before a big refactor; regenerate baselines (VISUAL_UPDATE=1 in the pinned
  # image) only when you actually want a new answer key.
  #
  # MANUAL ONLY since 2026-10-01 (owner): the Monday sweep (cron "0 3 * * 1")
  # was switched off. The harness renders the live data/ folder, which the
  # pipeline rewrites every weekday, so the Watchlist / Briefing baselines go
  # stale within a day of any regen: all 5 scheduled runs (2026-08-31 → 09-28)
  # failed and none was acted on. Making it meaningful again would need a
  # frozen data fixture for the harness.
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    # Keep this image tag IDENTICAL to the Makefile's PW_IMAGE so CI and local
    # `make visual` render pixel-for-pixel the same (fonts, anti-aliasing, and
    # chromium version all come from the image).
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-jammy
    steps:
      - uses: actions/checkout@v4

      # requirements.lock brings the app runtime the harness boots as a
      # subprocess; playwright is PINNED to 1.60.0 to match the image's bundled
      # chromium. TEST_DATE is NOT set here — conftest.py injects it into the
      # Streamlit server subprocess, so the frozen clock is inherited.
      - name: Install deps (app runtime + pinned playwright)
        run: pip install -r requirements.lock playwright==1.60.0 pytest-playwright pixelmatch pillow

      - name: Install chromium
        run: python -m playwright install chromium

      # `python -m pytest` (module form) puts the repo root on sys.path so the
      # suite's lib.* / tests.visual.* imports resolve.
      - name: Run visual regression
        run: python -m pytest tests/visual -q

      # On a diff, the harness writes <name>.actual.png + <name>.diff.png here;
      # download the "visual-diffs" artifact to see exactly what moved.
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/_diffs/
